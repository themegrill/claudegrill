# Drop this into each product repo as .github/workflows/qa-suite.yml
#
# THIS IS THE ONLY PR CHECK MOST PRODUCTS NEED.
#
# No ANTHROPIC_API_KEY. No agent. No API cost of any kind — runner minutes only,
# and those are free on a public repository.
#
# It works without AI because the developer already wrote the spec: they ran
# /themegrill-qa:verify-fix locally, write-spec added a @fresh spec to their
# branch, and they committed it with the fix. By the time CI sees the PR the
# regression is already a deterministic assertion. Nothing here needs judgement.
#
# TWO JOBS, and the split is the point:
#
#   pr        on every PR, scoped to the areas the diff maps to. Fast feedback.
#   nightly   the WHOLE @fresh tier, on a schedule.
#
# The nightly job is not optional garnish. Once PR runs are scoped, NOTHING else
# runs the full suite — a spec whose area is never touched would stop executing
# entirely, and you would not find out until the regression it guards shipped.
# Scoping trades total coverage per PR for speed; the schedule buys it back.
#
# Scoping is safe by construction: a changed source file matching no
# `area_paths` pattern in .themegrill-qa/suite.json falls back to the full tier.
# An unmapped change costs runner time, never coverage. If you have not written
# area_paths yet, every run is a full run and this file still behaves correctly.

name: QA suite (required)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    # 03:00 UTC daily. Catches what the scoped PR runs did not.
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  # The required check. Scoped, fast, runs on every PR including drafts.
  pr:
    if: github.event_name == 'pull_request'
    uses: ThemeGrill/themegrill-qa/.github/workflows/suite.yml@main
    with:
      product_slug: colormag
      product_type: theme
      scope: changed
    secrets:
      # Required while themegrill-qa is a PRIVATE repo. The default GITHUB_TOKEN
      # is scoped to THIS repo and cannot read another private one — the checkout
      # fails with a 404 that looks like the repo is missing. Use a PAT or GitHub
      # App token with read access, as an organisation secret so all seven
      # products share one.
      #
      # Also required, in the themegrill-qa repo:
      #   Settings > Actions > General > Access
      #     -> "Accessible from repositories in the <org> organization"
      #
      # If you make themegrill-qa public, delete this block entirely.
      QA_REPO_TOKEN: ${{ secrets.QA_REPO_TOKEN }}

  # The safety net. Everything, every night. Advisory — do not make it required,
  # or an unrelated flake blocks merges the next morning.
  nightly:
    if: github.event_name != 'pull_request'
    uses: ThemeGrill/themegrill-qa/.github/workflows/suite.yml@main
    with:
      product_slug: colormag
      product_type: theme
      scope: full
    secrets:
      QA_REPO_TOKEN: ${{ secrets.QA_REPO_TOKEN }}
