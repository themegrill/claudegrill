# Drop this into each product repo as .github/workflows/qa-suite.yml
#
# The free tier: no ANTHROPIC_API_KEY, no agent, runner minutes only. Because it
# costs nothing but time it runs on EVERY pull request including drafts, and it
# is the one that should be a required status check.
#
# The agent review (qa-review.yml) stays advisory. A required check that is
# occasionally wrong for unexplainable reasons is a check people learn to bypass.

name: QA suite

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  suite:
    uses: ThemeGrill/themegrill-qa/.github/workflows/suite.yml@main
    with:
      product_slug: colormag
      product_type: theme
      wp_version: latest
      php_version: "8.3"
