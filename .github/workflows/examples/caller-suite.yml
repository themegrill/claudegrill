# Drop this into each product repo as .github/workflows/qa-suite.yml
#
# THIS IS THE ONLY PR CHECK MOST PRODUCTS NEED.
#
# No ANTHROPIC_API_KEY. No agent. No API cost of any kind — runner minutes only.
# It runs on EVERY pull request including drafts, and it is the required status
# check.
#
# It works without AI because the developer already wrote the spec: they ran
# /themegrill-qa:verify-fix locally, write-spec added a @fresh spec to their
# branch, and they committed it with the fix. By the time CI sees the PR, the
# regression is already expressed as a deterministic assertion. There is nothing
# left here that needs judgement.
#
# What this job does, all deterministically:
#   1. runs the FULL @fresh tier — the whole regression net, not just the areas
#      the diff touched (that narrower run already happened on the developer's
#      machine, where tokens are the scarce resource)
#   2. annotates each failure onto the Files-changed view
#   3. warns when a PR changes product source but adds no spec
#   4. reports which areas have no @fresh coverage at all
#
# The agent workflows (qa-review.yml, qa-command.yml) are OPTIONAL and off by
# default under this model. Add them back only for a product where the suite is
# still too thin to trust.

name: QA suite (required)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  suite:
    uses: ThemeGrill/themegrill-qa/.github/workflows/suite.yml@main
    with:
      product_slug: colormag
      product_type: theme
      wp_version: latest
      php_version: "8.3"
    secrets:
      # Required while themegrill-qa is a PRIVATE repo. The default
      # GITHUB_TOKEN is scoped to THIS repo and cannot read another private
      # one — the checkout fails with a 404 that looks like the repo is
      # missing. Use a PAT or GitHub App token with read access, stored as an
      # organisation secret so all seven products share one.
      #
      # Two prerequisites people miss, both in the themegrill-qa repo:
      #   Settings > Actions > General > Access
      #     -> "Accessible from repositories in the <org> organization"
      #        (without this, the `uses:` above cannot resolve at all)
      #   the token itself needs only `contents: read` on themegrill-qa
      #
      # If you make themegrill-qa public, delete this block — the fallback to
      # GITHUB_TOKEN then works.
      QA_REPO_TOKEN: ${{ secrets.QA_REPO_TOKEN }}
