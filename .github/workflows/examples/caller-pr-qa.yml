# Drop this into each product repo as .github/workflows/qa-review.yml
#
# The AGENT tier — advisory, not a required check. It costs tokens, so it is
# gated on the PR being non-draft and on the diff containing functional changes,
# and it skips itself entirely when the suite's harness failed.
#
# This is one of three thin workflows a product repo needs; the whole per-product
# footprint is these three files plus .themegrill-qa/:
#
#   qa-suite.yml    caller-suite.yml    free, required check, every PR
#   qa-review.yml   this file           agent, advisory
#   qa-command.yml  caller-command.yml  @claudegrill
#
# Everything else lives in claudegrill.

name: QA review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**.md'
      - 'languages/**'
      - '.github/**'

jobs:
  qa:
    uses: ThemeGrill/claudegrill/.github/workflows/pr-qa.yml@main
    with:
      product_slug: colormag
      product_type: theme
      wp_version: latest
      php_version: "8.3"
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
