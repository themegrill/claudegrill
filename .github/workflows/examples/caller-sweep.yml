# Drop this into each product repo as .github/workflows/sweep.yml
#
# MANUAL ONLY, by design. You release 2-3 products a month, so a weekly cron
# would spend most of its money on weeks when nothing changed. Run this from
# Claude Code with `/full-test`, or from the Actions tab, when a product ships.
#
# The scheduled and release-driven triggers are kept below, commented out, for
# when a product's release cadence or bug rate justifies turning them back on.
# Re-enable them per product, not across the whole catalogue at once.

name: Regression sweep

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag or branch to sweep (blank = default branch)'
        required: false
        default: ''
      depth:
        description: 'Coverage depth'
        type: choice
        options: [full, smoke]
        default: full
      file_tickets:
        description: 'File verified findings as GitHub issues in this repo'
        type: boolean
        default: false

  # --- opt-in triggers, disabled ------------------------------------------
  #
  # On every published release. Full sweep for x.y.0, smoke for patches.
  # Turn this on for a product whose releases keep breaking things.
  #
  # release:
  #   types: [published]
  #
  # Nothing scheduled, deliberately. The team runs QA at two points only: a local
  # /claudegrill:verify-fix while the fix is written, and the e2e suite on the PR.
  # There is no nightly job and no WordPress-core watcher to dispatch one.

jobs:
  sweep:
    # A called workflow can only narrow what the caller grants, so `issues:
    # write` has to be here even though only the reusable workflow's aggregate
    # job uses it. Without it, filing fails at the very end of a paid sweep.
    permissions:
      contents: read
      issues: write
      id-token: write
    uses: ThemeGrill/claudegrill/.github/workflows/regression-sweep.yml@main
    with:
      product_slug: colormag
      product_type: theme
      version: ${{ inputs.version }}
      depth: ${{ inputs.depth || 'full' }}
      file_tickets: ${{ inputs.file_tickets || false }}

      # Areas mirror the critical-flows list in .themegrill-qa/knowledge.md.
      # This list is the direct multiplier on what a full sweep costs:
      # shards = areas × env combos. Keep it honest.
      areas_json: >-
        ["activation-and-fatals","customizer-round-trip","front-page-blocks",
         "header-and-menu","archive-single-search-404","demo-import",
         "woocommerce","upgrade-migration","roles-and-caps"]
      smoke_areas_json: >-
        ["activation-and-fatals","customizer-round-trip","upgrade-migration"]

      matrix_json: '[{"wp":"latest","php":"8.3"},{"wp":"6.7","php":"8.1"}]'

      budget_per_shard_usd: "3.50"
      max_shards: 20

      # Issues go to this repository by default — the bug, the fix, the spec and
      # the changelog entry then all live together. Set this only if the product
      # tracks its bugs somewhere else.
      # issue_repo: themegrill/some-other-repo
    secrets:
      # Filing needs no third-party credential: `gh` uses the built-in
      # GITHUB_TOKEN, scoped by the `permissions` block above.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
