name: Secret scan

# The CI half of the licence-key guard. The other half is the pre-commit hook in
# hooks/pre-commit-secrets — which developers can bypass with `--no-verify`, and
# which does not exist at all on a machine where nobody ran the installer. This
# job is the one that cannot be skipped.
#
# It runs on this repository, and the same job belongs in every product repo
# that holds a licence secret. `scan-secrets.mjs` takes `--cwd`, so a product
# repo runs it against its own tree with claudegrill checked out beside it.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # No secrets are given to this job, deliberately. It catches licence
      # material by SHAPE, which is the check that works against a colleague's
      # key as well as our own — and a scanner holding the very secret it is
      # protecting is one bad log line from defeating its own purpose.
      #
      # The literal-match check is the pre-commit hook's job, on the developer's
      # machine, where the key legitimately lives.
      - name: Scan tracked content for licence material
        run: node plugins/claudegrill/scripts/scan-secrets.mjs --tree

      # A second, narrower guard for the thing that must never ship. The licence
      # seeder writes licence options into whatever WordPress it loads in; in a
      # customer's site that is not a QA tool, it is a defect.
      - name: The licence seeder must not be in a release artefact
        run: |
          set -euo pipefail
          FOUND=0
          while IFS= read -r zip; do
            echo "checking $zip"
            node plugins/claudegrill/scripts/scan-secrets.mjs --zip "$zip" || FOUND=1
          done < <(find . -name '*.zip' -not -path './node_modules/*' -print)
          exit "$FOUND"
