name: QA suite (reusable)

# The AI-free tier. THIS WORKFLOW NEEDS NO ANTHROPIC_API_KEY and spends nothing
# but runner minutes — which is the whole point of it, and the reason it runs on
# every PR including drafts.
#
# It is therefore the natural **required** status check. The agent review
# (pr-qa.yml) should stay advisory: it is probabilistic, and a required check
# that is occasionally wrong for unexplainable reasons is a check people learn
# to bypass.
#
# Only the `fresh` tier ever runs here. A `@demo` spec needs the product's demo
# content imported, which a disposable runner site does not have, so running one
# would fail for reasons that have nothing to do with the pull request.

on:
  workflow_call:
    inputs:
      product_slug:
        description: "Product slug, must match a file in knowledge/<slug>.md"
        required: true
        type: string
      product_type:
        description: "theme or plugin"
        required: true
        type: string
      wp_version:
        required: false
        type: string
        default: "latest"
      php_version:
        required: false
        type: string
        default: "8.3"
      qa_ref:
        description: "Ref of the shared claudegrill repo to use"
        required: false
        type: string
        default: "main"
      node_version:
        required: false
        type: string
        default: "20"
      scope:
        description: >
          "changed" runs only the areas the PR's diff maps to via area_paths,
          falling back to the full tier whenever a changed source file matches
          no pattern. "full" always runs the whole @fresh tier. Scheduled and
          push runs should use "full".


          "specs" narrows further: when the diff contains spec files and does not
          touch the harness, it runs EXACTLY those spec files and nothing else.
          That matches how the team works — /verify-fix writes the guard and the
          developer commits it with the fix, so the branch already carries the
          deterministic assertion for its own change. It is the mode to choose
          when a run cannot fit its ceiling any other way. The trade is explicit:
          an existing spec in a touched area that this branch did not edit will
          not run, so a change that breaks a NEIGHBOURING guard ships unnoticed
          until the next full run. A diff with no spec files, or one that touches
          a fixture, falls back to "changed" behaviour on its own.
        required: false
        type: string
        default: "changed"
      engine:
        description: "playground | wp-env"
        required: false
        type: string
        default: "playground"
      test_timeout_ms:
        description: >
          Ceiling on ONE test. The whole-run ceiling cannot express this, and
          without it a single hanging spec burns the entire budget and the run is
          killed with no report — you learn that time ran out, not which spec ate
          it. 45s is generous against Playground's WASM PHP while still capping a
          runaway. Kept well below `timeout_ms` divided by `max_failures`, so a
          run of failures cannot reach the whole-run ceiling before max_failures
          stops it — two ceilings that contradict each other report nothing.
        required: false
        type: number
        default: 45000
      max_failures:
        description: >
          Stop after this many failures. A suite that is going to fail twenty
          times has told you everything useful by the fifth, and the rest is
          metered minutes.
        required: false
        type: number
        default: 3
      timeout_ms:
        description: >
          Hard ceiling on the suite run itself, in milliseconds. 30 minutes.


          This is a ceiling, not a budget: a scoped run finishes in a few minutes
          and is charged for what it used, so raising it costs nothing until a
          run actually needs the room. What it buys is that a slow-but-honest run
          FINISHES and reports, instead of being killed with a report Playwright
          had not written yet.


          The job's own `timeout-minutes` must stay comfortably ABOVE this, or
          GitHub kills the process tree first and you learn only that time ran
          out — never which spec ate it.
        required: false
        type: number
        default: 1800000

    secrets:
      QA_REPO_TOKEN:
        description: >
          Read access to the private claudegrill repo. Required while that
          repo is private: GITHUB_TOKEN is scoped to the calling repo and
          cannot read another private one.
        required: false

jobs:
  suite:
    runs-on: ubuntu-latest
    # Above `timeout_ms` (30 min), not equal to it. The job ceiling kills the
    # process tree outright and reports nothing; `run-suite.mjs`'s own ceiling
    # stops the run and still writes a report naming the spec that was running.
    # Equal ceilings would race, and the one that reports nothing could win.
    # The margin covers checkout, dependencies, the boot and the upload —
    # measured at ~2m15s together.
    timeout-minutes: 40

    # Read-only except for the checks the annotations produce. No comment is
    # posted and nothing is written back to the PR: the job's own pass/fail is
    # the signal, which is what a required check should be.
    permissions:
      contents: read
      pull-requests: write   # to post the one result comment

    concurrency:
      group: qa-suite-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true

    steps:
      - name: Check out the product
        uses: actions/checkout@v4
        with:
          # A product may vendor an SDK as a submodule; an empty submodule
          # directory fails silently rather than loudly. See pro-suite.yml.
          submodules: recursive
          fetch-depth: 0
          path: product

      - name: Check out shared QA tooling
        uses: actions/checkout@v4
        with:
          repository: ThemeGrill/claudegrill      # <-- change to your org/repo
          ref: ${{ inputs.qa_ref }}
          # GITHUB_TOKEN is scoped to the repo running this workflow and CANNOT
          # read a different private repository — it fails with a 404 that reads
          # like the repo does not exist. While claudegrill is private, the
          # caller must pass QA_REPO_TOKEN: a PAT or GitHub App token with
          # read access to it, ideally an organisation secret so all seven
          # products share one. The fallback only works if claudegrill is public.
          token: ${{ secrets.QA_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          path: claudegrill

      # Products declare their own install/run commands in
      # .themegrill-qa/suite.json, and every one of them so far is a pnpm
      # project ("install": "pnpm install --frozen-lockfile"). The runner image
      # ships npm and yarn but NOT pnpm, so without this step run-suite.mjs dies
      # with `install failed to start: spawn pnpm ENOENT` before a single spec
      # runs. Installing it unconditionally is a few seconds and keeps this
      # workflow agnostic about which manager a given product picked.
      #
      # Pinned to 10 because the products' lockfiles are lockfileVersion 9.0,
      # which pnpm 8 cannot read — it would fail `--frozen-lockfile` instead.
      # The product's PHP dependencies, which are NOT in the checkout: every
      # ThemeGrill product gitignores `vendor/`, and both the free and pro themes
      # pull `themegrill/themegrill-sdk` — the package that defines
      # `FS_ThemeGrill`, and therefore the pro gate itself.
      #
      # Without this the theme still activates and nothing fatals, because
      # `functions.php` guards the autoload require with `file_exists`. The
      # symptom is much worse than a crash: the pro gate becomes unevaluable, the
      # licence seeder reports `not attempted`, and the run fails looking exactly
      # like a bad licence key. That cost a full debugging round trip once.
      #
      # Packagist only — no `repositories` block in either composer.json — so no
      # token and no auth are involved.
      # THE COST GATE. Everything expensive below is conditional on this.
      #
      # A pull request tests exactly what its diff maps to. When the diff maps to
      # no spec area, the job stops here — before Composer, before pnpm, before
      # Chromium, before Playground — because those five steps are most of the
      # metered minutes and running them to execute zero specs is pure waste.
      #
      # This deliberately does NOT fall back to the full tier on an unmapped
      # file. That fallback is what made one push cost ninety minutes. The
      # unmapped files are printed instead, so the gap in `area_paths` is visible
      # on every PR that has one rather than hidden behind a full run.
      - name: Work out what this PR touches
        id: scope
        env:
          SCOPE_INPUT: ${{ inputs.scope }}
        run: |
          set -o pipefail

          # Only a pull request is scoped. A manual run is somebody deliberately
          # asking for everything, and skipping it would be surprising.
          if [ -z "${{ github.event.pull_request.base.ref }}" ]; then
            echo '{"ok":true,"run":true,"areas":[],"reason":"not a pull request — full fresh tier"}' > scope.json
            cat scope.json
          else
          node claudegrill/plugins/claudegrill/scripts/pr-scope.mjs \
            --diff-root product \
            ${{ github.event.pull_request.base.ref && format('--since origin/{0}', github.event.pull_request.base.ref) || '' }} \
            | tee scope.json
          fi

          node -e '
            const s = JSON.parse(require("fs").readFileSync("scope.json","utf8"));
            const fs = require("fs"), out = process.env.GITHUB_OUTPUT;
            fs.appendFileSync(out, `run=${s.run ? "true" : "false"}\n`);
            fs.appendFileSync(out, `areas=${(s.areas||[]).join(",")}\n`);
            fs.appendFileSync(out, `ok=${s.ok ? "true" : "false"}\n`);
            fs.appendFileSync(out, `reason=${s.reason}\n`);
            // The spec list and the mode pr-scope.mjs recommends. Whether they
            // are USED is the caller`s decision (inputs.scope), so both are
            // always emitted and the run step chooses.
            fs.appendFileSync(out, `specs=${(s.specs||[]).join(",")}\n`);
            fs.appendFileSync(out, `mode=${s.mode || "areas"}\n`);
            const sum = process.env.GITHUB_STEP_SUMMARY;
            const gaps = s.unmapped || [];
            const specMode = process.env.SCOPE_INPUT === "specs" && s.mode === "specs";
            if (!s.ok) {
              fs.appendFileSync(sum, `### could not work out the PR scope\n\n${s.reason}\n`);
            } else if (!s.run) {
              fs.appendFileSync(sum, `### nothing to run\n\n${s.reason}\n\n` +
                (gaps.length ? `These changed files match no \`area_paths\` pattern, so **nothing tested them**:\n\n` +
                  gaps.map((f) => `- \`${f}\``).join("\n") + `\n\nAdd them to \`area_paths\` in .themegrill-qa/suite.json.\n` : ""));
            } else if (specMode) {
              // Say what was NOT run, every time. A narrowed run that reports
              // only what it did is the shape of check that is trusted for more
              // than it checked.
              fs.appendFileSync(sum, `Scope: **${s.specs.length} spec file(s) this branch changed** (${s.changed} changed files)\n\n` +
                s.specs.map((f) => `- \`${f}\``).join("\n") +
                `\n\nOther specs in ${s.areas.length ? `**${s.areas.join(", ")}**` : "the touched areas"} did **not** run — ` +
                `\`scope: specs\` tests the guard this branch committed, not the whole area.\n`);
              if (gaps.length) fs.appendFileSync(sum, `\n${gaps.length} changed file(s) map to no area:\n\n` +
                gaps.map((f) => `- \`${f}\``).join("\n") + `\n`);
            } else {
              fs.appendFileSync(sum, `Scope: **${s.areas.join(", ")}** (${s.changed} changed files)\n`);
              if (gaps.length) fs.appendFileSync(sum, `\n${gaps.length} changed file(s) map to no area and were **not** covered:\n\n` +
                gaps.map((f) => `- \`${f}\``).join("\n") + `\n`);
            }
          '

          # A diff we could not compute is a broken configuration, not an empty
          # PR, and must never pass quietly.
          if [ "$(node -pe 'JSON.parse(require("fs").readFileSync("scope.json","utf8")).ok')" != "true" ]; then
            echo "::error::could not work out the PR scope — see the summary"
            exit 1
          fi

      - name: Install PHP dependencies
        if: steps.scope.outputs.run == 'true'
        run: |
          for dir in product; do
            if [ -f "$dir/composer.json" ]; then
              echo "composer install in $dir"
              composer install --working-dir="$dir" \
                --no-dev --no-interaction --no-progress --prefer-dist
            else
              echo "no composer.json in $dir — skipped"
            fi
          done

      - name: Install pnpm
        if: steps.scope.outputs.run == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: ${{ inputs.node_version }}

      # Does this product even have a suite? No suite is a valid state, and the
      # job should be a visible skip rather than a confusing green.
      # Three matrix jobs each re-downloaded Chromium (~150 MB) and re-resolved
      # the pnpm store from scratch. On a metered private repo that is pure
      # overhead paid three times per push, before a single spec runs.
      - name: Cache the pnpm store and Playwright's browsers
        if: steps.scope.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.local/share/pnpm/store
            ~/.pnpm-store
          key: qa-deps-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml', '**/package-lock.json') }}
          restore-keys: |
            qa-deps-${{ runner.os }}-

      - name: Look for a suite manifest
        if: steps.scope.outputs.run == 'true'
        id: manifest
        working-directory: product
        run: |
          if [ -f .themegrill-qa/suite.json ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No .themegrill-qa/suite.json — this product has no suite yet." >> "$GITHUB_STEP_SUMMARY"
            echo "See SUITE.md in ThemeGrill/claudegrill for what to add." >> "$GITHUB_STEP_SUMMARY"
          fi

      # The browser build is pinned to the Playwright VERSION, so it has to be
      # downloaded by the product's OWN Playwright — which means installing the
      # product's dependencies first, here rather than only inside
      # run-suite.mjs.
      #
      # `npx --yes playwright@latest install chromium` fetched whatever revision
      # the newest release wanted while ColorMag pins @playwright/test 1.51.1,
      # whose runner looks for revision 1161 and dies with "Executable doesn't
      # exist at …/chromium_headless_shell-1161". A browser cache that is full
      # of the wrong revision is indistinguishable from an empty one.
      #
      # Only Chromium: the full `--with-deps` install pulls three engines and
      # adds minutes to every run for coverage nobody reads.
      - name: Install the product's dependencies and its Chromium
        if: steps.manifest.outputs.found == 'true'
        working-directory: product
        run: |
          set -euo pipefail
          pm=$(node -p 'require("./.themegrill-qa/suite.json").package_manager || "npm"')
          install=$(node -p 'require("./.themegrill-qa/suite.json").install || ""')
          if [ -n "$install" ]; then
            echo "installing: $install"
            sh -c "$install"
          fi
          # run-suite.mjs still runs the same install below — it owns reporting a
          # failed install as a harness error, and a second identical install is
          # a no-op that costs seconds.
          "$pm" exec -- playwright install --with-deps chromium

      - name: Boot a disposable WordPress
        if: steps.manifest.outputs.found == 'true'
        working-directory: product
        env:
          WP_VERSION: ${{ inputs.wp_version }}
          PHP_VERSION: ${{ inputs.php_version }}
        run: |
          set -o pipefail
          node ../claudegrill/plugins/claudegrill/scripts/boot-wp.mjs \
            --engine "${{ inputs.engine }}" | tee ../boot.json
          echo "TGQA_BASE_URL=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("../boot.json","utf8")).url)')" >> "$GITHUB_ENV"
          # TGQA_ENV travels with the URL or the site gets misidentified.
          #
          # run-suite.mjs only infers the engine when IT boots the site. Here the
          # boot is a separate step and the suite is handed a bare --base-url, so
          # without this line run-suite falls back to TGQA_ENV=local and tells the
          # product it is talking to a real MySQL WordPress. ColorMag's
          # global-setup.ts believes it, runs its MySQL-only changeset cleanup,
          # throws on a runner that has neither WP_DB_* nor a mysql binary, and
          # Playwright reports 0 tests — a BROKEN suite, not a failing one.
          echo "TGQA_ENV=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("../boot.json","utf8")).engine)')" >> "$GITHUB_ENV"

      - name: Run the suite (fresh tier)
        id: suite
        if: steps.manifest.outputs.found == 'true'
        working-directory: product
        run: |
          set +e
          # --since narrows to the areas this diff maps to. The narrowing is
          # SAFE by construction: any changed source file that matches no
          # area_paths pattern falls back to the full tier, so an unmapped
          # change costs runner time rather than coverage.
          SCOPE_ARGS=""
          # The scope gate already resolved this, for pull requests and for
          # everything else. `scope: full` still means the whole tier.
          SCOPE_ARGS="--area '${{ steps.scope.outputs.areas }}'"
          if [ -z "${{ steps.scope.outputs.areas }}" ] || [ "${{ inputs.scope }}" = "full" ]; then
            SCOPE_ARGS=""
          fi

          # `scope: specs` REPLACES the area filter with the spec files this
          # branch changed, and only when pr-scope.mjs said that is safe — it
          # answers "areas" whenever the diff has no spec files or touched a
          # fixture, and this must not override that judgement.
          #
          # --spec composes with --tier and --pro (unlike --grep, which replaces
          # them), so a @demo test inside a changed spec file still does not run
          # on a runner that cannot support it.
          if [ "${{ inputs.scope }}" = "specs" ] && [ "${{ steps.scope.outputs.mode }}" = "specs" ] \
             && [ -n "${{ steps.scope.outputs.specs }}" ]; then
            SCOPE_ARGS="--spec '${{ steps.scope.outputs.specs }}'"
          fi

          node ../claudegrill/plugins/claudegrill/scripts/run-suite.mjs \
            --tier fresh --json --full-results $SCOPE_ARGS \
            --timeout-ms ${{ inputs.timeout_ms }} \
            --test-timeout-ms ${{ inputs.test_timeout_ms }} \
            --max-failures ${{ inputs.max_failures }} \
            --base-url "$TGQA_BASE_URL" > ../suite.json
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          cat ../suite.json

      # Annotations land in the Files-changed view, which is where the author is
      # already looking. A failure they have to go hunting for in a log is a
      # failure they will not read.
      - name: Annotate failures onto the PR
        if: always() && steps.manifest.outputs.found == 'true'
        run: |
          node - <<'JS'
          const fs = require("fs");
          let r;
          try { r = JSON.parse(fs.readFileSync("suite.json", "utf8")); }
          catch { console.log("::warning::run-suite.mjs produced no parseable JSON"); process.exit(0); }

          if (r.suite === false) { console.log("::notice::no suite manifest"); process.exit(0); }

          // Exit 2 means the harness broke, which is NOT the same as tests
          // failing and must never be reported as a test failure.
          if (r.ok === false && !r.failures) {
            console.log(`::error::suite could not run — ${r.reason ?? "unknown"}`);
            process.exit(0);
          }

          for (const f of r.failures ?? []) {
            const msg = String(f.error ?? "").replace(/\r?\n/g, "%0A");
            // `location` is where the assertion actually threw; `line` is only
            // where the test opens. Annotating the latter has sent reviewers to
            // the wrong line of the wrong file for as long as this has run.
            const at = f.location?.file ? f.location : { file: f.file, line: f.line };
            console.log(`::error file=${at.file},line=${at.line ?? 1}::${f.title} — ${msg}`);
          }
          for (const f of r.fixme ?? []) {
            console.log(`::notice file=${f.file},line=${f.line ?? 1}::fixme, still open: ${f.title}`);
          }
          JS

      # Deterministic, no AI: did a PR that changes product source also add or
      # change a spec? A nudge in the summary, never a failure — some changes
      # genuinely need no spec, and a hard gate here would train people to add
      # an empty one to get past it.
      - name: Note whether this PR carries a spec
        if: always() && steps.manifest.outputs.found == 'true' && github.event_name == 'pull_request'
        working-directory: product
        run: |
          SPEC_DIR="$(node -e 'console.log(JSON.parse(require("fs").readFileSync(".themegrill-qa/suite.json","utf8")).spec_dir||"tests/e2e/specs")')"
          BASE="origin/${{ github.event.pull_request.base.ref }}"
          git fetch origin "${{ github.event.pull_request.base.ref }}" --depth=1 -q || true
          FILES="$(git diff --name-only "$BASE"...HEAD || true)"

          SRC="$(printf '%s\n' "$FILES" | grep -E '\.(php|js|jsx|ts|tsx|scss|css)$' | grep -vE "^($SPEC_DIR/|tests?/)" || true)"
          SPECS="$(printf '%s\n' "$FILES" | grep -E "^$SPEC_DIR/|\.spec\.[cm]?[jt]sx?$" || true)"

          if [ -n "$SRC" ] && [ -z "$SPECS" ]; then
            {
              echo ""
              echo "### No regression spec in this PR"
              echo ""
              echo "This PR changes product source but adds no spec. If the change fixes a"
              echo "bug, run \`/claudegrill:verify-fix\` locally and let \`write-spec\` add one"
              echo "to this branch — a finding without a spec is one you pay to rediscover."
              echo ""
              echo "<details><summary>Source files changed</summary>"
              echo ""
              echo '```'
              printf '%s\n' "$SRC"
              echo '```'
              echo ""
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::This PR changes product source but adds no regression spec."
          fi

      # Coverage, deterministically. No agent, no tokens — suite-index.mjs is
      # plain Node reading the specs and the knowledge file. The report reads
      # this file; the composing all happens in one place, below.
      - name: Index the suite's coverage
        if: always() && steps.manifest.outputs.found == 'true'
        working-directory: product
        run: |
          node ../claudegrill/plugins/claudegrill/scripts/suite-index.mjs \
            > ../index.json 2>/dev/null || echo '{"suite":false}' > ../index.json

      # The page a human actually reads. Self-contained: screenshots are inlined
      # as data URIs, so it survives being downloaded, unzipped and opened from
      # disk with no server. --product-dir is where the repo-relative attachment
      # paths in suite.json resolve.
      - name: Build the HTML report
        if: always() && steps.manifest.outputs.found == 'true'
        run: |
          node claudegrill/plugins/claudegrill/scripts/report-suite.mjs \
            --suite suite.json --index index.json \
            --format html --out qa-report.html \
            --product-dir product \
            --repo "${{ github.repository }}" \
            --sha "${{ github.event.pull_request.head.sha || github.sha }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # Before the comment, deliberately: the upload is what mints the URL the
      # comment links to. Uploaded and never linked is how this artifact spent
      # its whole life being invisible.
      - name: Upload the report and the evidence
        id: upload
        if: always() && steps.manifest.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: qa-suite-${{ inputs.product_slug }}-${{ github.event.pull_request.number || github.run_id }}
          # `**/test-results/**` as well as the top-level one, because a
          # product's outputDir is its own choice: ColorMag's real attachments
          # land in tests/e2e/test-results/, and the top-level glob alone would
          # have uploaded an artifact with no evidence in it.
          path: |
            qa-report.html
            product/playwright-report/**
            product/test-results/**
            product/**/test-results/**
            suite.json
          if-no-files-found: ignore
          retention-days: 14

      # The check status is the gate; this comment is how a human reads the
      # result without opening the Actions tab. Deterministic — no agent, no API
      # key. One comment per PR, edited in place: a PR with nine bot comments
      # gets muted, and then nobody reads any of them.
      - name: Post the result on the PR
        if: always() && steps.manifest.outputs.found == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          node claudegrill/plugins/claudegrill/scripts/report-suite.mjs \
            --suite suite.json --index index.json --format md --out body.md \
            --repo "$REPO" \
            --sha "${{ github.event.pull_request.head.sha }}" \
            --artifact-url "${{ steps.upload.outputs.artifact-url }}" \
            --artifact-name "qa-suite-${{ inputs.product_slug }}-$PR" \
            --run-url "${{ github.server_url }}/$REPO/actions/runs/${{ github.run_id }}"

          # One comment, edited in place, found by its marker.
          ID="$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
                 --jq '[.[] | select(.body | contains("<!-- claudegrill-suite -->"))][0].id // empty')"
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$ID" -F body=@body.md >/dev/null
            echo "updated comment $ID"
          else
            gh pr comment "$PR" --repo "$REPO" --body-file body.md
          fi

      # The same composer again, so the summary and the comment can never drift
      # apart the way the two hand-written copies did.
      - name: Write the run summary
        if: always() && steps.manifest.outputs.found == 'true'
        run: |
          node claudegrill/plugins/claudegrill/scripts/report-suite.mjs \
            --suite suite.json --index index.json --format summary \
            --repo "${{ github.repository }}" \
            --sha "${{ github.event.pull_request.head.sha || github.sha }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Stop the site
        if: always() && steps.manifest.outputs.found == 'true'
        working-directory: product
        run: node ../claudegrill/plugins/claudegrill/scripts/boot-wp.mjs --stop || true

      # Exit non-zero so this can be a required check. The distinction matters:
      # exit 1 is "your tests failed", exit 2 is "the harness broke" — and the
      # second must not be silently reported as the first.
      - name: Fail the job on suite failure
        if: steps.manifest.outputs.found == 'true'
        run: |
          CODE="${{ steps.suite.outputs.exit }}"
          case "$CODE" in
            0) echo "suite passed" ;;
            1) echo "::error::suite failed — see annotations above"; exit 1 ;;
            *) echo "::error::suite could not run (exit $CODE) — this is a harness failure, not a test failure"; exit 1 ;;
          esac
