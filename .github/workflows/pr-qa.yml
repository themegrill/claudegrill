name: PR QA (reusable)

# Reusable workflow. Each product repo calls this — see examples/caller-pr-qa.yml.
# One place to fix the pipeline, seven products consuming it.

on:
  workflow_call:
    inputs:
      product_slug:
        description: "Product slug, must match a file in knowledge/<slug>.md"
        required: true
        type: string
      product_type:
        description: "theme or plugin"
        required: true
        type: string
      wp_version:
        required: false
        type: string
        default: "latest"
      php_version:
        required: false
        type: string
        default: "8.3"
      qa_ref:
        description: "Ref of the shared themegrill-qa repo to use"
        required: false
        type: string
        default: "main"
      model:
        required: false
        type: string
        default: "claude-sonnet-5"
      budget_usd:
        description: "Hard spend cap for this review. The run stops when reached."
        required: false
        type: string
        default: "1.50"
      max_turns:
        description: "Turn ceiling, as a runaway-loop guard."
        required: false
        type: number
        default: 80
      skip_agent_on_suite_harness_failure:
        description: >
          When run-suite.mjs exits 2 — the harness broke, as opposed to tests
          failing — skip the agent rather than spending tokens exploring an
          environment that is already known not to work.
        required: false
        type: boolean
        default: true
    secrets:
      ANTHROPIC_API_KEY:
        required: true

jobs:
  qa:
    # Draft PRs are work in progress; reviewing them wastes tokens and annoys people.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      pull-requests: write   # needed to post and edit the verdict comment
      issues: read
      id-token: write

    # A push to a PR under review supersedes the run in flight. Without this you
    # pay for every intermediate commit.
    concurrency:
      group: pr-qa-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - name: Check out the product
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the review needs the base branch to compare against
          path: product

      - name: Check out shared QA tooling
        uses: actions/checkout@v4
        with:
          repository: ThemeGrill/themegrill-qa      # <-- change to your org/repo
          ref: ${{ inputs.qa_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          path: themegrill-qa

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Only what the browser needs. Full `playwright install --with-deps` pulls
      # three engines and adds minutes to every run.
      - name: Install Chromium
        run: npx --yes playwright@latest install --with-deps chromium

      - name: Decide whether this PR is worth a QA run
        id: triage
        working-directory: product
        run: |
          BASE="origin/${{ github.event.pull_request.base.ref }}"
          git fetch origin "${{ github.event.pull_request.base.ref }}" --depth=1 -q || true
          FILES="$(git diff --name-only "$BASE"...HEAD || git diff --name-only HEAD~1)"
          echo "$FILES"
          # Docs/CI/translation-only changes do not need a browser.
          if [ -z "$(printf '%s\n' "$FILES" | grep -vE '(\.md$|\.txt$|\.po$|\.pot$|\.mo$|^\.github/|^\.gitignore$|^languages/|LICENSE)' || true)" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No functional changes — skipping QA run."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble MCP config
        if: steps.triage.outputs.run == 'true'
        run: |
          mkdir -p .qa
          cat > .qa/mcp.json <<'JSON'
          {
            "mcpServers": {
              "playwright": {
                "type": "stdio",
                "command": "npx",
                "args": ["-y", "@playwright/mcp@latest", "--headless", "--isolated",
                         "--browser", "chromium", "--no-sandbox",
                         "--viewport-size", "1440x900",
                         "--save-session",
                         "--output-dir", "/tmp/qa-evidence"]
              }
            }
          }
          JSON
          cp -r themegrill-qa/plugins/themegrill-qa/scripts themegrill-qa/plugins/themegrill-qa/blueprints product/ 2>/dev/null || true
          cp -r themegrill-qa/knowledge product/ 2>/dev/null || true
          mkdir -p product/.claude && cp -r themegrill-qa/plugins/themegrill-qa/skills product/.claude/skills
          # nothing to chmod: the scripts are Node

      # The cheap layer runs first, and its result is handed to the agent rather
      # than rediscovered by it. Booting here (not inside the agent's session)
      # also means one boot per run instead of two.
      - name: Boot a disposable WordPress
        id: boot
        if: steps.triage.outputs.run == 'true'
        working-directory: product
        env:
          WP_VERSION: ${{ inputs.wp_version }}
          PHP_VERSION: ${{ inputs.php_version }}
        run: |
          set -o pipefail
          node ../themegrill-qa/plugins/themegrill-qa/scripts/boot-wp.mjs \
            --engine playground | tee ../boot.json
          URL="$(node -e 'console.log(JSON.parse(require("fs").readFileSync("../boot.json","utf8")).url)')"
          echo "TGQA_BASE_URL=$URL" >> "$GITHUB_ENV"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Run the suite (fresh tier)
        id: suite
        if: steps.triage.outputs.run == 'true'
        working-directory: product
        run: |
          set +e
          node ../themegrill-qa/plugins/themegrill-qa/scripts/run-suite.mjs \
            --tier fresh --install --json --base-url "$TGQA_BASE_URL" > ../suite.json
          CODE=$?
          echo "exit=$CODE" >> "$GITHUB_OUTPUT"
          cat ../suite.json
          cp ../suite.json ./suite-result.json
          # Exit 2 is a broken harness. Exploring on top of one wastes the whole
          # budget producing findings about the environment, not the product.
          if [ "$CODE" = "2" ] && [ "${{ inputs.skip_agent_on_suite_harness_failure }}" = "true" ]; then
            echo "skip_agent=true" >> "$GITHUB_OUTPUT"
            echo "::warning::suite harness failed — skipping the agent review"
          else
            echo "skip_agent=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Suite index — what the agent does not need to look at
        if: steps.triage.outputs.run == 'true'
        working-directory: product
        run: |
          node ../themegrill-qa/plugins/themegrill-qa/scripts/suite-index.mjs --pretty \
            > ./suite-index.json 2>/dev/null || echo '{"suite":false}' > ./suite-index.json
          cat ./suite-index.json

      - name: QA review
        if: steps.triage.outputs.run == 'true' && steps.suite.outputs.skip_agent != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            /pr-qa-review

            Review pull request #${{ github.event.pull_request.number }} in
            ${{ github.repository }}.

            Product: ${{ inputs.product_slug }} (${{ inputs.product_type }})
            Base branch: ${{ github.event.pull_request.base.ref }}
            Head SHA: ${{ github.event.pull_request.head.sha }}
            Target environment: WordPress ${{ inputs.wp_version }}, PHP ${{ inputs.php_version }}

            A WordPress site is ALREADY RUNNING at ${{ steps.boot.outputs.url }}
            with the PR's code mounted. Use it — do not boot another.

            The suite has already run against it. Read these two files FIRST and
            do not rediscover what they already tell you:

              ./product/suite-result.json  — the run: pass/fail counts, and each
                                             failure with its file, line, area,
                                             guards and error
              ./product/suite-index.json   — what the suite covers. Derive your
                                             missions from `areas_uncovered`, and
                                             say in the comment which areas you
                                             skipped because the suite covers them

            If suite-result.json lists failures, **triaging them is mission M1** —
            it is the cheapest useful work available and it is not optional.
            Cross-check each against the base branch and label anything that also
            fails there as pre-existing.

            Work inside the ./product directory. Follow the pr-qa-review skill
            exactly. Post exactly one comment on the PR carrying the
            <!-- themegrill-qa-bot --> marker, editing your previous marked comment if one
            already exists rather than adding another.

            You have no merge authority. Do not commit, push, or submit a formal
            GitHub review. Comment only.
          claude_args: >-
            --model ${{ inputs.model }}
            --mcp-config .qa/mcp.json
            --allowedTools "Bash,Read,Grep,Glob,mcp__playwright__*,mcp__github__*"
            --permission-mode dontAsk
            --max-turns ${{ inputs.max_turns }}
            --max-budget-usd ${{ inputs.budget_usd }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WP_VERSION: ${{ inputs.wp_version }}
          PHP_VERSION: ${{ inputs.php_version }}
          PRODUCT_SLUG: ${{ inputs.product_slug }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      # The PR comment is the summary; this is the audit trail. Everything the
      # browser did lands here — screenshots, the recorded MCP session, the
      # WordPress debug log.
      - name: Upload evidence
        if: always() && steps.triage.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: qa-evidence-pr-${{ github.event.pull_request.number }}
          path: |
            /tmp/qa-evidence/**
            suite.json
            product/playwright-report/**
            product/test-results/**
            product/**/*.png
            product/**/*.webm
            product/**/trace*.zip
            /tmp/playground.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop the site
        if: always() && steps.triage.outputs.run == 'true'
        working-directory: product
        run: node ../themegrill-qa/plugins/themegrill-qa/scripts/boot-wp.mjs --stop || true

      # Mirror the verdict onto the Actions run page, so the run itself is
      # readable without going back to the PR conversation.
      - name: Run summary
        if: always() && steps.triage.outputs.run == 'true'
        run: |
          {
            echo "## QA run — PR #${{ github.event.pull_request.number }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Product | \`${{ inputs.product_slug }}\` (${{ inputs.product_type }}) |"
            echo "| Environment | WP ${{ inputs.wp_version }} · PHP ${{ inputs.php_version }} |"
            echo "| Commit | \`${{ github.event.pull_request.head.sha }}\` |"
            echo ""
            echo "The verdict is posted as a comment on the PR."
            echo "Screenshots, the recorded browser session and the WordPress debug log"
            echo "are in the **qa-evidence-pr-${{ github.event.pull_request.number }}** artifact below."
            echo ""
            if [ -d /tmp/qa-evidence ]; then
              echo "<details><summary>Evidence captured</summary>"
              echo ""
              echo '```'
              find /tmp/qa-evidence -type f -printf '%P  (%sB)\n' 2>/dev/null | head -60 || true
              echo '```'
              echo ""
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
